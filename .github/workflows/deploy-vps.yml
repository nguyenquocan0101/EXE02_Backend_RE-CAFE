name: Deploy To VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate deploy secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME || vars.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "$VPS_HOST" ] || { echo "::error::Missing VPS_HOST (set either Repository Secret or Repository Variable)"; exit 1; }
          [ -n "$VPS_USERNAME" ] || { echo "::error::Missing VPS_USERNAME (set either Repository Secret or Repository Variable)"; exit 1; }
          [ -n "$VPS_SSH_KEY" ] || { echo "::error::Missing repository secret VPS_SSH_KEY"; exit 1; }

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || vars.VPS_PORT || '22' }}
          command_timeout: 20m
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/EXE02_Backend_RE-CAFE"
            fi

            REPO_URL="${{ secrets.DEPLOY_REPO_URL || vars.DEPLOY_REPO_URL }}"
            if [ -z "$REPO_URL" ]; then
              REPO_URL="https://github.com/${{ github.repository }}.git"
            fi

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              if ! mkdir -p "$DEPLOY_PATH" 2>/dev/null; then
                sudo mkdir -p "$DEPLOY_PATH"
                sudo chown -R "$USER":"$USER" "$DEPLOY_PATH"
              fi
              git clone --branch main "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Neither docker compose nor docker-compose is installed."
              exit 1
            fi

            is_port_in_use() {
              local port="$1"
              ss -ltnH 2>/dev/null | awk '{print $4}' | grep -Eq ":${port}$"
            }

            POSTGRES_PORT="${{ secrets.POSTGRES_PORT || vars.POSTGRES_PORT }}"
            if [ -z "$POSTGRES_PORT" ]; then
              EXISTING_POSTGRES_PORT="$($COMPOSE_CMD port postgres 5432 2>/dev/null | head -n1 | awk -F: '{print $NF}')"
              if [ -n "$EXISTING_POSTGRES_PORT" ]; then
                POSTGRES_PORT="$EXISTING_POSTGRES_PORT"
                echo "Reuse existing POSTGRES_PORT=$POSTGRES_PORT"
              else
                for candidate in 5432 5433 5434 5435 5436 5437 5438 5439 5440; do
                  if ! is_port_in_use "$candidate"; then
                    POSTGRES_PORT="$candidate"
                    break
                  fi
                done

                if [ -z "$POSTGRES_PORT" ]; then
                  echo "No available PostgreSQL port found in range 5432-5440."
                  echo "Set POSTGRES_PORT explicitly in GitHub Secret/Variable."
                  exit 1
                fi
              fi
            fi

            export POSTGRES_PORT
            echo "Deploy with POSTGRES_PORT=$POSTGRES_PORT"

            $COMPOSE_CMD up -d --build --remove-orphans
